<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
<head>
   <meta charset="UTF-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <meta name="theme-color" content="#f6f7f9">
   <script>
      (function () {
         var theme = null;

         try {
            theme = localStorage.getItem('theme');
         } catch (error) {
            // Continue with the visitor's system preference when storage is unavailable.
         }

         if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
         }

         document.documentElement.dataset.theme = theme;
         document.documentElement.style.colorScheme = theme;
         document.querySelector('meta[name="theme-color"]').content =
            theme === 'dark' ? '#0b1120' : '#f6f7f9';
      })();
   </script>
   <link rel="apple-touch-icon" sizes="180x180" href="{{ '/favicon_io/apple-touch-icon.png' | relative_url }}">
   <link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon_io/favicon-32x32.png' | relative_url }}">
   <link rel="icon" type="image/png" sizes="16x16" href="{{ '/favicon_io/favicon-16x16.png' | relative_url }}">
   <link rel="manifest" href="{{ '/favicon_io/site.webmanifest' | relative_url }}">
   <link rel="mask-icon" href="{{ '/favicon_io/safari-pinned-tab.svg' | relative_url }}" color="#5bbad5">
   <meta name="msapplication-TileColor" content="#da532c">
   {% seo %}
   <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
   <link rel="stylesheet" href="{{ '/styles/default.css' | relative_url }}">
   {% if site.google_analytics %}
   <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
   <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '{{ site.google_analytics }}');
   </script>
   {% endif %}
   <!--[if lt IE 9]>
   <script src="https://cdnjs.cloudflare.com/ajax/libs/html5shiv/3.7.3/html5shiv.min.js"></script>
   <![endif]-->
</head>
