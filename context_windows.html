<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>LLM Context Window Visualizer</title>
    <script>
        (function () {
            let theme = null;
            try {
                theme = localStorage.getItem('theme');
            } catch (error) {
                // Fall back to the visitor's system preference.
            }
            if (theme !== 'light' && theme !== 'dark') {
                theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.dataset.theme = theme;
            document.documentElement.style.colorScheme = theme;
            document.querySelector('meta[name="theme-color"]').content =
                theme === 'light' ? '#eef2f7' : '#0f172a';
        }());
    </script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.6);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --active-color: #38bdf8;
            --page-glow: #1e293b;
            --control-bg: rgba(30, 41, 59, 0.8);
            --control-hover: rgba(255, 255, 255, 0.1);
            --border-color: rgba(255, 255, 255, 0.1);
            --dot-bg: #1e293b;
        }

        html[data-theme="light"] {
            --bg-color: #eef2f7;
            --card-bg: rgba(255, 255, 255, 0.78);
            --text-main: #172033;
            --text-muted: #5b677a;
            --page-glow: #ffffff;
            --control-bg: rgba(255, 255, 255, 0.9);
            --control-hover: rgba(36, 87, 214, 0.08);
            --border-color: rgba(23, 32, 51, 0.14);
            --dot-bg: #d8e0eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top, var(--page-glow) 0%, var(--bg-color) 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #fff, #94a3b8);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        html[data-theme="light"] h1 {
            background-image: linear-gradient(to right, #172033, #5b677a);
        }

        .theme-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            padding: 0;
            border: 1px solid var(--border-color);
            border-radius: 999px;
            background: var(--control-bg);
            color: var(--text-main);
            appearance: none;
            cursor: pointer;
            backdrop-filter: blur(10px);
            z-index: 1;
        }

        .theme-toggle .icon {
            width: 1.15rem;
            height: 1.15rem;
            fill: currentColor;
        }

        .theme-toggle__sun {
            display: none;
        }

        html[data-theme="dark"] .theme-toggle__moon {
            display: none;
        }

        html[data-theme="dark"] .theme-toggle__sun {
            display: block;
        }

        .theme-toggle:hover,
        .theme-toggle:focus-visible {
            background: var(--control-hover);
        }

        .theme-toggle:focus-visible {
            outline: 2px solid var(--active-color);
            outline-offset: 2px;
        }

        p.subtitle {
            color: var(--text-muted);
            max-width: 600px;
            line-height: 1.5;
        }

        /* Presets */
        .presets {
            display: flex;
            gap: 1rem;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .preset-btn {
            background: var(--control-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.75rem 1.5rem;
            border-radius: 99px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 140px;
        }

        .preset-btn span.desc {
            font-size: 0.7rem;
            font-weight: 400;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .preset-btn:hover {
            background: var(--control-hover);
            transform: translateY(-2px);
        }

        .preset-btn.active {
            border-color: var(--active-color);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 20px calc(var(--active-color) / 0.2), inset 0 0 10px calc(var(--active-color) / 0.1);
        }

        .preset-btn.active span.desc {
            color: var(--text-main);
        }

        /* Central Visualizer */
        .visualizer-container {
            width: 100%;
            max-width: 800px;
            margin-bottom: 3rem;
        }

        .visualizer-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 1rem;
        }

        .token-count {
            font-size: 3rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            color: var(--active-color);
            transition: color 0.5s;
            text-shadow: 0 0 20px calc(var(--active-color) / 0.4);
        }

        .token-label {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(50, 1fr);
            gap: 3px;
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .dot {
            width: 100%;
            aspect-ratio: 1;
            background: var(--dot-bg);
            border-radius: 2px;
            transition: background 0.2s, box-shadow 0.2s;
        }

        .grid-legend {
            text-align: right;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 0.75rem;
        }

        /* Metrics Cards */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 1000px;
        }

        .metric-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            backdrop-filter: blur(10px);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .metric-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            border-color: var(--active-color);
        }

        html[data-theme="light"] .grid,
        html[data-theme="light"] .metric-card:hover {
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        }

        .metric-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .metric-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.25rem;
            font-variant-numeric: tabular-nums;
        }

        .metric-label {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .metric-subtext {
            color: var(--active-color);
            font-size: 0.8rem;
            margin-top: 0.5rem;
            height: 1rem;
            transition: color 0.5s;
        }

        @media (max-width: 600px) {
            .theme-toggle {
                position: static;
                align-self: flex-end;
                width: 38px;
                height: 38px;
                margin-bottom: 1rem;
            }
            .grid { grid-template-columns: repeat(25, 1fr); }
            .token-count { font-size: 2rem; }
            .preset-btn { width: calc(50% - 0.5rem); min-width: auto; }
        }
    </style>
</head>
<body>

    <button class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
        <svg class="icon theme-toggle__moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.7 15.1A8 8 0 0 1 8.9 3.3 9 9 0 1 0 20.7 15.1ZM12 21a7 7 0 0 1-6.2-10.3 10 10 0 0 0 7.5 7.5A7 7 0 0 0 17 18a7 7 0 0 1-5 3Z"/>
        </svg>
        <svg class="icon theme-toggle__sun" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M11 2h2v3h-2V2Zm0 17h2v3h-2v-3ZM4.2 5.6 5.6 4.2l2.1 2.1-1.4 1.4-2.1-2.1Zm12.1 12.1 1.4-1.4 2.1 2.1-1.4 1.4-2.1-2.1ZM2 11h3v2H2v-2Zm17 0h3v2h-3v-2ZM4.2 18.4l2.1-2.1 1.4 1.4-2.1 2.1-1.4-1.4ZM16.3 6.3l2.1-2.1 1.4 1.4-2.1 2.1-1.4-1.4ZM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"/>
        </svg>
    </button>

    <header>
        <h1>Context Window Visualizer</h1>
        <p class="subtitle">Experience the scale of data modern AI models can hold in a single thought.</p>
    </header>

    <div class="presets" id="presets">
        <!-- Buttons generated by JS -->
    </div>

    <div class="visualizer-container">
        <div class="visualizer-header">
            <div>
                <div class="token-label">Total Context Capacity</div>
                <div class="token-count" id="token-display">0</div>
            </div>
        </div>
        <div class="grid" id="dot-grid">
            <!-- 1000 dots generated by JS -->
        </div>
        <div class="grid-legend">Each block represents 1,000 tokens</div>
    </div>

    <div class="metrics-grid" id="metrics">
        <!-- Cards generated by JS -->
    </div>

    <script src="/assets/js/theme.js"></script>
    <script>
        // Data Configuration
        const presets = {
            '4k': { tokens: 4096, label: '4,096', desc: 'GPT-3.5 Turbo Orig.', color: '#38bdf8' },
            '32k': { tokens: 32768, label: '32k', desc: 'GPT-4 Experimental', color: '#a855f7' },
            '200k': { tokens: 200000, label: '200k', desc: 'Standard Today', color: '#f59e0b' },
            '1m': { tokens: 1000000, label: '1 Million', desc: 'Advanced Upper Limit', color: '#10b981' }
        };

        // Estimations: Units per token
        const metricsData =[
            { id: 'pages', icon: '📄', label: 'Pages of Text', tokensPerUnit: 400, calcSub: (val) => val >= 300 ? `(~ ${(val/300).toFixed(1)} Books)` : '' },
            { id: 'code', icon: '💻', label: 'Lines of Code', tokensPerUnit: 10, calcSub: () => '' },
            { id: 'files', icon: '📁', label: 'Source Files', tokensPerUnit: 2000, calcSub: () => '' },
            { id: 'tweets', icon: '🐦', label: 'Tweets', tokensPerUnit: 50, calcSub: () => '' },
            { id: 'essays', icon: '📝', label: '5-Para Essays', tokensPerUnit: 650, calcSub: () => '' },
            { id: 'resumes', icon: '👔', label: 'Resumes', tokensPerUnit: 500, calcSub: () => '' }
        ];

        let currentTokens = 0;
        let metricCurrentValues = { pages: 0, code: 0, files: 0, tweets: 0, essays: 0, resumes: 0 };
        const totalDots = 1000;
        const tokensPerDot = 1000;

        // Initialize UI
        function init() {
            // Render Presets
            const presetContainer = document.getElementById('presets');
            Object.keys(presets).forEach(key => {
                const btn = document.createElement('button');
                btn.className = 'preset-btn';
                btn.id = `btn-${key}`;
                btn.innerHTML = `${presets[key].label}<span class="desc">${presets[key].desc}</span>`;
                btn.onclick = () => setContext(key);
                presetContainer.appendChild(btn);
            });

            // Render Grid
            const gridContainer = document.getElementById('dot-grid');
            for (let i = 0; i < totalDots; i++) {
                const dot = document.createElement('div');
                dot.className = 'dot';
                gridContainer.appendChild(dot);
            }

            // Render Metrics
            const metricsContainer = document.getElementById('metrics');
            metricsData.forEach(m => {
                const card = document.createElement('div');
                card.className = 'metric-card';
                card.innerHTML = `
                    <div class="metric-icon">${m.icon}</div>
                    <div class="metric-value" id="val-${m.id}">0</div>
                    <div class="metric-label">${m.label}</div>
                    <div class="metric-subtext" id="sub-${m.id}"></div>
                `;
                metricsContainer.appendChild(card);
            });

            // Start with 4k
            setContext('4k');
        }

        // Animate Number Counting
        function animateValue(id, start, end, duration, isInteger = true) {
            const obj = document.getElementById(id);
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                
                // Ease out cubic
                const easeOut = 1 - Math.pow(1 - progress, 3);
                let current = start + easeOut * (end - start);
                
                obj.innerText = (isInteger ? Math.round(current) : current).toLocaleString(undefined, {
                    maximumFractionDigits: isInteger ? 0 : 1
                });
                
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                }
            };
            window.requestAnimationFrame(step);
        }

        // Main transition function
        function setContext(presetKey) {
            const target = presets[presetKey];
            const targetTokens = target.tokens;

            // Update Active Buttons & Theme
            document.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${presetKey}`).classList.add('active');
            document.documentElement.style.setProperty('--active-color', target.color);

            // Animate Total Tokens
            animateValue('token-display', currentTokens, targetTokens, 1500, true);

            // Animate Metrics Cards
            metricsData.forEach(m => {
                const targetValue = targetTokens / m.tokensPerUnit;
                animateValue(`val-${m.id}`, metricCurrentValues[m.id], targetValue, 1500, true);
                metricCurrentValues[m.id] = targetValue;

                // Update subtext if applicable
                const subEl = document.getElementById(`sub-${m.id}`);
                subEl.innerText = m.calcSub(targetValue);
            });

            // Satisfying Sweep Animation for the Grid
            const dots = document.querySelectorAll('.dot');
            dots.forEach((dot, index) => {
                const dotTokensStart = index * tokensPerDot;
                
                // Calculate delay based on dot position to create a sweeping effect
                const delay = index * 0.8; // ms

                setTimeout(() => {
                    if (targetTokens > dotTokensStart) {
                        let fillPercentage = ((targetTokens - dotTokensStart) / tokensPerDot) * 100;
                        if (fillPercentage >= 100) {
                            dot.style.background = target.color;
                            dot.style.boxShadow = `0 0 6px ${target.color}`;
                        } else {
                            // Partial fill using a gradient
                            dot.style.background = `linear-gradient(to right, ${target.color} ${fillPercentage}%, var(--dot-bg) ${fillPercentage}%)`;
                            dot.style.boxShadow = 'none';
                        }
                    } else {
                        dot.style.background = 'var(--dot-bg)';
                        dot.style.boxShadow = 'none';
                    }
                }, delay);
            });

            currentTokens = targetTokens;
        }

        // Boot up
        window.onload = init;
    </script>
</body>
</html>
